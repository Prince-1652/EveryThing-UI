[Rainmeter]
Update=33
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Hamster Animation Transparent
Author=Prince-1652
Information=Nothing OS style widget with animated hamster (No background).
Version=1.0

[Variables]
@IncludeGlobal=#@#Variables.inc
WidgetWidth=190
WidgetHeight=190
CornerRadius=30
Padding=10

[MeasureCounter]
Measure=Calc
Formula=(MeasureCounter % 239) + 1

[MeasureFrame]
Measure=Calc
Formula=MeasureCounter - 1
RegExpSubstitute=1
Substitute="^(\d)$":"0000\1","^(\d{2})$":"000\1","^(\d{3})$":"00\1"

[MeterDragBackground]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,#CornerRadius# | StrokeWidth 0 | FillColor 0,0,0,1
AntiAlias=1

[MeterHamsterImage]
Meter=Image
ImageName=#@#Images\hamster\frame[MeasureFrame].png
X=0
Y=(#WidgetHeight# - #Padding# - ((#WidgetWidth# - #Padding# * 2) * 720 / 1280 * 1.2))
W=((#WidgetWidth# - #Padding# * 2) * 1.2)
H=((#WidgetWidth# - #Padding# * 2) * 720 / 1280 * 1.2)
PreserveAspectRatio=1
DynamicVariables=1
AntiAlias=1
