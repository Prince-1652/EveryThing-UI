[Rainmeter]
Update=33
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Dog Animation Light
Author=Prince-1652
Information=Nothing OS style square widget with animated dog (Light version).
Version=1.0

[Variables]
@IncludeGlobal=#@#Variables.inc
WidgetColor=F0F0F0
WidgetWidth=190
WidgetHeight=190
CornerRadius=30
Padding=10

[MeasureCounter]
Measure=Calc
Formula=(MeasureCounter % 239) + 1

[MeasureFrame]
Measure=Calc
Formula=MeasureCounter - 1
RegExpSubstitute=1
Substitute="^(\d)$":"0000\1","^(\d{2})$":"000\1","^(\d{3})$":"00\1"

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,#CornerRadius# | StrokeWidth 0 | FillColor #WidgetColor#
AntiAlias=1

[MeterDogContainer]
Meter=Shape
Shape=Rectangle #Padding#,#Padding#,(#WidgetWidth# - #Padding# * 2),(#WidgetHeight# - #Padding# * 2),(#CornerRadius# - #Padding#) | StrokeWidth 0 | FillColor 255,255,255,255
AntiAlias=1

[MeterDogImage]
Meter=Image
ImageName=#@#Images\dog\frame[MeasureFrame].png
X=(#Padding# - (#WidgetWidth# - #Padding# * 2) * 0.1)
Y=(#WidgetHeight# - #Padding# - ((#WidgetWidth# - #Padding# * 2) * 720 / 1280 * 1.2))
W=((#WidgetWidth# - #Padding# * 2) * 1.2)
H=((#WidgetWidth# - #Padding# * 2) * 720 / 1280 * 1.2)
PreserveAspectRatio=1
Container=MeterDogContainer
DynamicVariables=1
AntiAlias=1
