[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Weather Dark
Author=Prince-1652
Information=Nothing OS style square weather widget (Dark version). Auto-detects location via IP.
Version=1.0

[Variables]
@IncludeGlobal=#@#Variables.inc
WidgetColor=1A1D1C
WidgetWidth=190
WidgetHeight=190
CornerRadius=30
FontColor=FFFFFF
FontFace=Ndot 57 Aligned

[MeasureRunWeather]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -EncodedCommand 
State=Hide
OutputType=ANSI

[MeasureTimer]
Measure=Calc
Formula=(MeasureTimer % 1800) + 1
IfCondition=MeasureTimer = 1
IfTrueAction=[!CommandMeasure MeasureRunWeather "Run"]

[MeasureWeatherOutput]
Measure=String
String=[MeasureRunWeather]
DynamicVariables=1

[MeasureTemp]
Measure=String
String=[MeasureWeatherOutput]
DynamicVariables=1
RegExpSubstitute=1
Substitute="\s+":"","^(.*)\|(.*)$":"\1","^$":"--"

[MeasureCode]
Measure=String
String=[MeasureWeatherOutput]
DynamicVariables=1
RegExpSubstitute=1
Substitute="\s+":"","^(.*)\|(.*)$":"\2","^$":"-1"

[MeasureWeatherState]
Measure=Calc
Formula=([MeasureCode] = 0) || ([MeasureCode] = 1) ? 0 : ((([MeasureCode] >= 2) && ([MeasureCode] <= 48)) ? 1 : ((([MeasureCode] >= 51) && ([MeasureCode] <= 67)) || (([MeasureCode] >= 80) && ([MeasureCode] <= 82)) ? 2 : ((([MeasureCode] >= 71) && ([MeasureCode] <= 77)) || (([MeasureCode] >= 85) && ([MeasureCode] <= 99)) ? 3 : -1)))
DynamicVariables=1

[MeasureWeatherDesc]
Measure=String
String=[MeasureCode]
DynamicVariables=1
RegExpSubstitute=1
Substitute="\s+":"","^0$":"CLEAR","^1$":"CLEAR","^2$":"CLOUDY","^3$":"OVERCAST","^45$":"FOG","^48$":"FOG","^51$":"DRIZZLE","^53$":"DRIZZLE","^55$":"DRIZZLE","^56$":"DRIZZLE","^57$":"DRIZZLE","^61$":"RAIN","^63$":"RAIN","^65$":"HEAVY RAIN","^66$":"RAIN","^67$":"RAIN","^71$":"SNOW","^73$":"SNOW","^75$":"HEAVY SNOW","^77$":"SNOW","^80$":"RAIN","^81$":"RAIN","^82$":"HEAVY RAIN","^85$":"SNOW","^86$":"SNOW","^95$":"STORM","^96$":"STORM","^99$":"STORM","^-1$":"FETCHING..."

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,#CornerRadius# | StrokeWidth 0 | FillColor #WidgetColor#
AntiAlias=1

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
FontFace=#FontFace#
FontSize=36
FontColor=#FontColor#
X=15
Y=88
Text=%1[\x00B0]
DynamicVariables=1
AntiAlias=1

[MeterCondition]
Meter=String
MeasureName=MeasureWeatherDesc
FontFace=#FontFace#
FontSize=18
FontColor=EA3323
X=15
Y=140
W=150
ClipString=1
Text=%1
AntiAlias=1

[MeterIconSun]
Meter=Shape
X=130
Y=13
Shape=Ellipse 25,25,12 | StrokeWidth 4 | StrokeColor EA3323 | FillColor 0,0,0,0
Shape2=Line 25,5,25,8 | StrokeWidth 4 | StrokeColor EA3323
Shape3=Line 25,42,25,45 | StrokeWidth 4 | StrokeColor EA3323
Shape4=Line 5,25,8,25 | StrokeWidth 4 | StrokeColor EA3323
Shape5=Line 42,25,45,25 | StrokeWidth 4 | StrokeColor EA3323
Hidden=([MeasureWeatherState] <> 0)
DynamicVariables=1
AntiAlias=1

[MeterIconCloud]
Meter=Shape
X=130
Y=13
Shape=Ellipse 15,30,10
Shape2=Ellipse 32,25,14
Shape3=Rectangle 15,25,20,15
Shape4=Combine Shape | Union Shape2 | Union Shape3
Shape5=Rectangle -10,40,70,20
Shape6=Combine Shape4 | Exclude Shape5 | StrokeWidth 4 | StrokeColor EA3323 | FillColor 0,0,0,0
Hidden=([MeasureWeatherState] <> 1)
DynamicVariables=1
AntiAlias=1

[MeterIconRain]
Meter=Shape
X=130
Y=13
Shape=Ellipse 15,30,10
Shape2=Ellipse 32,25,14
Shape3=Rectangle 15,25,20,15
Shape4=Combine Shape | Union Shape2 | Union Shape3
Shape5=Rectangle -10,40,70,20
Shape6=Combine Shape4 | Exclude Shape5 | StrokeWidth 4 | StrokeColor EA3323 | FillColor 0,0,0,0
Shape7=Line 15,48,10,55 | StrokeWidth 3 | StrokeColor EA3323
Shape8=Line 27,48,22,55 | StrokeWidth 3 | StrokeColor EA3323
Shape9=Line 39,48,34,55 | StrokeWidth 3 | StrokeColor EA3323
Hidden=([MeasureWeatherState] <> 2)
DynamicVariables=1
AntiAlias=1

[MeterIconSnow]
Meter=Shape
X=130
Y=13
Shape=Ellipse 15,30,10
Shape2=Ellipse 32,25,14
Shape3=Rectangle 15,25,20,15
Shape4=Combine Shape | Union Shape2 | Union Shape3
Shape5=Rectangle -10,40,70,20
Shape6=Combine Shape4 | Exclude Shape5 | StrokeWidth 4 | StrokeColor EA3323 | FillColor 0,0,0,0
Shape7=Ellipse 15,50,3 | StrokeWidth 0 | FillColor EA3323
Shape8=Ellipse 27,50,3 | StrokeWidth 0 | FillColor EA3323
Shape9=Ellipse 39,50,3 | StrokeWidth 0 | FillColor EA3323
Hidden=([MeasureWeatherState] <> 3)
DynamicVariables=1
AntiAlias=1
